name: zh-authenticator release

on:
  push:
    tags:
      - "v-zh-authenticator-android-*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Decode the release keystore
        env:
          ZH_KEYSTORE_BASE64: ${{ secrets.ZH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ZH_KEYSTORE_BASE64" ]; then
            echo "Missing secret ZH_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$ZH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zh-release.keystore"

      - name: Build release APKs
        env:
          ZH_KEYSTORE_PATH: ${{ runner.temp }}/zh-release.keystore
          ZH_KEYSTORE_PASSWORD: ${{ secrets.ZH_KEYSTORE_PASSWORD }}
          ZH_KEY_ALIAS: ${{ secrets.ZH_KEY_ALIAS }}
          ZH_KEY_PASSWORD: ${{ secrets.ZH_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.BW_PACKAGES_TOKEN }}
        run: ./gradlew :app:assembleStandardRelease --stacktrace

      - name: Checksums
        working-directory: app/build/outputs/apk/standard/release
        run: sha256sum *.apk | tee SHA256SUMS

      - name: Attach APKs to the tag release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/standard/release/SHA256SUMS
          fail_on_unmatched_files: true
